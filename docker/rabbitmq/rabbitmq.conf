# Formación automática del clúster de 2 nodos (rabbit@rabbit1 y rabbit@rabbit2)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Con 2 nodos, "autoheal" repara particiones de red sin dejar el clúster detenido
cluster_partition_handling = autoheal

# Límites razonables para correr en una instancia pequeña
vm_memory_high_watermark.relative = 0.4
disk_free_limit.absolute = 200MB
management.rates_mode = basic
