server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta del frontend devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Archivos con hash en el nombre: cache largo. index.html: sin cache.
  location ~* \.(js|css|woff2?|png|ico|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
